# ============================================================
#  wheelchair.uz — Nginx Configuration
#  Fayl joyi: /etc/nginx/sites-available/wheelchair-uz
#  Aktivlashtirish: ln -s /etc/nginx/sites-available/wheelchair-uz /etc/nginx/sites-enabled/
# ============================================================

# ── HTTP → HTTPS redirect ────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name wheelchair.uz www.wheelchair.uz admin.wheelchair.uz api.wheelchair.uz;
    return 301 https://$host$request_uri;
}

# ── Main site: wheelchair.uz ─────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wheelchair.uz www.wheelchair.uz;

    ssl_certificate     /etc/letsencrypt/live/wheelchair.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wheelchair.uz/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:50m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Frontend React SPA
    root /var/www/wheelchair-frontend/dist;
    index index.html;

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # SPA routing — ALL paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    }

    # Forward /api to backend
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    # Upload files served directly
    location /uploads/ {
        alias /var/www/wheelchair-backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    access_log /var/log/nginx/wheelchair-access.log;
    error_log  /var/log/nginx/wheelchair-error.log;
}

# ── Admin panel: admin.wheelchair.uz ────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.wheelchair.uz;

    ssl_certificate     /etc/letsencrypt/live/wheelchair.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wheelchair.uz/privkey.pem;

    # Same frontend dist — React Router handles /admin/* routes
    root /var/www/wheelchair-frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Redirect bare root to admin login
    location = / {
        return 301 /admin/login;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Admin API calls
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    location /uploads/ {
        alias /var/www/wheelchair-backend/uploads/;
        expires 30d;
    }

    # Basic IP restriction (ixtiyoriy — faqat ma'lum IP lardan kirish)
    # allow 1.2.3.4;
    # deny all;

    access_log /var/log/nginx/wheelchair-admin-access.log;
    error_log  /var/log/nginx/wheelchair-admin-error.log;
}

# ── API subdomain: api.wheelchair.uz (ixtiyoriy) ─────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.wheelchair.uz;

    ssl_certificate     /etc/letsencrypt/live/wheelchair.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wheelchair.uz/privkey.pem;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    access_log /var/log/nginx/wheelchair-api-access.log;
    error_log  /var/log/nginx/wheelchair-api-error.log;
}
