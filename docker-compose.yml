services:
  # ── PostgreSQL Database ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wheelchair_user
      POSTGRES_PASSWORD: wheelchair_pass_local
      POSTGRES_DB: wheelchair_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wheelchair_user -d wheelchair_db']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── NestJS Backend ────────────────────────────────────────
  backend:
    build:
      context: ./wheelchair-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '${BACKEND_PUBLISH:-3002}:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: wheelchair_user
      DB_PASSWORD: wheelchair_pass_local
      DB_DATABASE: wheelchair_db
      DB_SYNC: 'true'
      JWT_SECRET: local-dev-jwt-secret-change-in-prod
      JWT_EXPIRES_IN: 7d
      ADMIN_EMAIL: admin@wheelchair.uz
      ADMIN_PASSWORD: admin123
      ADMIN_NAME: Admin
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      FRONTEND_URL: http://localhost:8080
      ADMIN_URL: http://localhost:8080
      SWAGGER_ENABLED: 'true'
      SEED_PRODUCTS: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'node -e ''fetch("http://127.0.0.1:3000/api/v1/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))''']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./scripts:/app/scripts:ro
      - ./wheelchair-backend/uploads:/app/uploads

  # ── React Frontend ────────────────────────────────────────
  frontend:
    build:
      context: ./wheelchair-react
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '${FRONTEND_PUBLISH:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: /api/v1
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  uploads_data:
