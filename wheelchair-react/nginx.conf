server {
    listen 80;
    server_name wheelchair.uz www.wheelchair.uz;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wheelchair.uz www.wheelchair.uz;

    ssl_certificate /etc/letsencrypt/live/wheelchair.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wheelchair.uz/privkey.pem;

    root /var/www/wheelchair-uz/dist;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React SPA routing — ALL paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}

# Admin subdomain
server {
    listen 80;
    server_name admin.wheelchair.uz;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.wheelchair.uz;

    ssl_certificate /etc/letsencrypt/live/wheelchair.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wheelchair.uz/privkey.pem;

    root /var/www/wheelchair-uz/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Redirect root to /admin
    location = / {
        return 301 /admin/login;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
